# libFuzzer harness for fsring-user decoders. Standalone package (own
# [workspace]) so it is not part of the main workspace and does not affect the
# ordinary `cargo build`/`cargo test`. Run with a nightly toolchain:
#   cargo +nightly fuzz run section_decode
#   cargo +nightly fuzz run control_decode
[package]
name = "fsring-user-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `testkit` gives grant_resolve the kernel-role Harness (section + arena + grant
# issuance); it adds only that module and leaves the decoders unchanged.
fsring-user = { path = "..", features = ["testkit"] }
# The completion_encode target builds wire bodies (SqeBody) and calls the ABI
# completion-registry validator directly, as fsring-user's own tests do.
fsring-abi = { path = "../../fsring-abi" }

[[bin]]
name = "section_decode"
path = "fuzz_targets/section_decode.rs"
test = false
doc = false
bench = false

