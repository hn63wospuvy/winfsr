language = "C"
include_guard = "FSRING_ABI_H"
cpp_compat = true
style = "both"
line_endings = "LF"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
documentation_length = "full"
include_version = true
package_version = true
autogen_warning = "/* Generated by pinned cbindgen 0.29.4; do not edit manually. */"
usize_is_size_t = true
only_target_dependencies = true
# Keep the wire header suitable for kernel/SEH shims: every exported field is a
# fixed-width integer, so the default host/CRT include set is unnecessary.
no_includes = true
after_includes = "#include <stdint.h>"

header = """
/*
 * FSRING ABI v2 C declarations.
 *
 * Source of truth: the public wire types and constants in fsring-abi.
 * Regenerate with the exact command documented in README.md.
 */
#if defined(_MSC_VER)
#  define FSRING_ALIGN(N) __declspec(align(N))
#elif defined(__GNUC__) || defined(__clang__)
#  define FSRING_ALIGN(N) __attribute__((aligned(N)))
#else
#  error "FSRING ABI requires a compiler-specific alignment annotation"
#endif
"""

trailer = """
#undef FSRING_ALIGN
"""

[parse]
parse_deps = false

[layout]
aligned_n = "FSRING_ALIGN"

[export]
item_types = ["constants", "structs", "typedefs"]
exclude = ["MAX_RESERVE_RETRIES"]
include = [
    # ABI identity, packing, registry values, and feature/capability bits.
    "FSRING_MAGIC",
    "FSRING_ABI_MAJOR",
